# ============================================================
# COMPLETE NGINX CONFIG for erp.garshoub.com (ERP Backend)
# ============================================================
# In aaPanel: Website → erp.garshoub.com → Config
# Paste this ENTIRE block, replacing the old server {} block
# ============================================================

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name erp.garshoub.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/erp.garshoub.com;

    # SSL Certificates (keep your existing paths)
    ssl_certificate    /www/server/panel/vhost/cert/erp.garshoub.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/erp.garshoub.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    # Reverse Proxy to Odoo (THE IMPORTANT PART)
    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_redirect off;

        # Essential headers for Odoo behind reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (Odoo 19 livechat / bus / presence)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (Odoo can be slow on some operations)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffering
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 502 /502.html;

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification for SSL certificate
    location ~ \.well-known{
        allow all;
    }

    # Prohibit sensitive files in certificate directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/erp.garshoub.com.log;
    error_log  /www/wwwlogs/erp.garshoub.com.error.log;
}
