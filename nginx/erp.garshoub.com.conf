# ============================================================
# nginx config for erp.garshoub.com (Odoo ERP Backend)
# ============================================================
# Place this in aaPanel's nginx config for the erp.garshoub.com site
# or symlink it from /www/server/panel/vhost/nginx/

upstream odoo_erp {
    server 127.0.0.1:8069 weight=1 fail_timeout=0;
}

upstream odoo_erp_longpolling {
    server 127.0.0.1:8072 weight=1 fail_timeout=0;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name erp.garshoub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.garshoub.com;

    # SSL certificates (aaPanel usually manages these)
    # ssl_certificate /www/server/panel/vhost/cert/erp.garshoub.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/erp.garshoub.com/privkey.pem;

    # Logging
    access_log /www/wwwlogs/erp.garshoub.com.log;
    error_log /www/wwwlogs/erp.garshoub.com.error.log;

    # Proxy timeouts (Odoo can be slow on first load)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Gzip compression
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip_vary on;

    # Increase max body size for file uploads
    client_max_body_size 200M;

    # Proxy headers — CRITICAL for Odoo behind reverse proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 443;

    # Proxy settings
    proxy_redirect off;
    proxy_buffering off;

    # Longpolling / websocket support
    location /websocket {
        proxy_pass http://odoo_erp_longpolling;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /longpolling {
        proxy_pass http://odoo_erp_longpolling;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /web/assets {
        proxy_pass http://odoo_erp;
        proxy_cache_valid 200 1d;
        proxy_buffering on;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /web/content {
        proxy_pass http://odoo_erp;
        proxy_cache_valid 200 1d;
        proxy_buffering on;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Main Odoo proxy
    location / {
        proxy_pass http://odoo_erp;
    }
}
