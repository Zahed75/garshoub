# ============================================================
# NGINX CONFIG for garshoub.com (Public Website)
# ============================================================
# Add this inside the server {} block for garshoub.com in aaPanel
# Location: aaPanel → Website → garshoub.com → Config
#
# IMPORTANT: These proxy headers tell Odoo that the original request
# was HTTPS, so it generates https:// asset URLs instead of http://
# ============================================================

location / {
    proxy_pass http://127.0.0.1:8069;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support (for Odoo 19 livechat/presence)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Buffering
    proxy_buffering off;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

# Optional: force redirect HTTP to HTTPS
server {
    listen 80;
    server_name garshoub.com www.garshoub.com;
    return 301 https://$server_name$request_uri;
}
